<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publish Viking Postcard</title><style>body{font-family:system-ui;background:#edf3f5;color:#173944;margin:0;padding:22px}.panel{max-width:540px;margin:35px auto;background:white;border-radius:16px;padding:25px;box-shadow:0 5px 25px #0001}label{display:block;margin:18px 0 6px;font-weight:700}input,textarea,button{width:100%;box-sizing:border-box;font:inherit;padding:12px;border-radius:9px;border:1px solid #bacbd0}button{margin-top:22px;background:#126b58;color:white;border:0;font-weight:700}button:disabled{opacity:.5}small{color:#52666b}img{max-width:100%;border-radius:10px;margin-top:15px}#status{margin-top:15px}</style></head><body><main class="panel"><h1>📷 Publish a Viking Postcard</h1><p>Share a photo with family without opening GitHub.</p><form id="form"><label for="date">Date</label><input type="date" id="date" required><label for="place">Location / title</label><input id="place" maxlength="100" placeholder="Leaving Seattle" required><label for="note">Caption</label><textarea id="note" rows="4" maxlength="1200" required></textarea><label for="photo">Photo</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required><img id="preview" hidden alt="Photo preview"><label for="password">Private publishing password</label><input id="password" type="password" autocomplete="current-password" required><button id="publish" type="submit">Publish Postcard</button><p id="status" role="status"></p></form><small>Photos are publicly visible after publication. Never include cabin numbers or other private information.</small></main><script src="postcard-admin.js"></script></body></html>
